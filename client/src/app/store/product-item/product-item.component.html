<div class="card h-100 shadow-5m" *ngIf="product">
    <div class="image position-relative;" style="cursor:pointer">
        <img [src]="'assets/images/products/' + extractImageName()" class="img-fluid bg-light" [alt]="product.name"/>
        <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ product.name }}</h5>
            <p class="card-text">
                Price :{{ product.price | currency:"INR" }}</p>

            <!-- button -->
            <div class="btn-group mt-auto">
                <button class="btn btn-primary me-2 " routerLink="/store/{{ product.id }}">View</button>
                <button class="btn btn-success fa fa-shopping-cart">
                </button>
            </div>
        </div>
    </div>
</div>
